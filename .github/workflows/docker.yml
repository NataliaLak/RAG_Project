name: Build & Push RAG Project

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch: 

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: natalialak
  FAISS_IMAGE: faiss-service
  STREAMLIT_IMAGE: rag-app

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------- FAISS ----------
      - name: Build & push FAISS image
        uses: docker/build-push-action@v5
        with:
          context: ./faiss
          file: ./faiss/Dockerfile.faiss
          push: true
          pull: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/${{ env.FAISS_IMAGE }}:latest
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/${{ env.FAISS_IMAGE }}:${{ github.sha }}

      # ---------- STREAMLIT ----------
      - name: Build & push RAG app image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          pull: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/${{ env.STREAMLIT_IMAGE }}:latest
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/${{ env.STREAMLIT_IMAGE }}:${{ github.sha }}
