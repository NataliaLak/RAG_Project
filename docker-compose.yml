services:
  faiss:
    build:
      context: ./faiss
      dockerfile: Dockerfile.faiss
    container_name: faiss-index
    ports:
      - "${FAISS_PORT:-8001}:8001"
    volumes:
      - faiss_data:/faiss/faiss_index
    restart: unless-stopped

  rag-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: rag-app
    ports:
      - "${APP_PORT:-8501}:8501"
    depends_on:
      - faiss
    env_file:
      - .env
    volumes:
      - ./app:/app
      - ./.streamlit/secrets.toml:/app/.streamlit/secrets.toml
    restart: unless-stopped

volumes:
  faiss_data:


